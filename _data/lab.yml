intro_en: >-
  Geneticode Lab develops computational methods that read biological function
  from genetic sequence. Current work focuses on protein function annotation
  and the effects of amino-acid mutations.
intro_zh: >-
  Geneticode Lab 研究如何从遗传序列解读生物学功能。目前的工作集中在蛋白质功能注释，以及氨基酸突变带来的效应。
