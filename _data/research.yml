# Research cards. Shown on the Research page and, when home is true, on the home page.
#
# Fields:
#   title, summary, tags (list), links (list of label/url)
#   home: true to feature on the home page
# Add another direction as a new list item. Set home: true to show it on the home page.
# Example:
# - title: Next research direction
#   summary: One or two sentences.
#   home: false
#   links: []

- title: Protein function prediction
  summary: >-
    S2DA-GO predicts Gene Ontology functions from protein sequence. A global
    sequence branch is paired with a gradient-decoupled cross-attention branch
    and with semantic priors from GO term text, so rare functional labels
    interfere less with the shared representation.
  tags:
    - Gene Ontology
    - Protein language models
  home: true
  links:
    - label: Paper
      url: https://doi.org/10.3389/fgene.2026.1880976
    - label: Code
      url: https://github.com/geneticodelab/S2DA-GO

- title: Mutation effect prediction
  summary: >-
    SpaSem (Spatial–Semantic Integration) is a dual-stream model for zero-shot
    prediction of protein mutation effects. It fuses geometric structure with
    longer-range evolutionary signal so variants can be scored without building
    a new structure for every mutant. A formal citation has not been added yet.
  tags:
    - Mutations
    - Sequence and structure
  home: true
  links:
    - label: Code
      url: https://github.com/geneticodelab/SpaSem
