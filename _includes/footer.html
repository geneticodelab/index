<footer class="site-footer">
  <div class="container footer-inner">
    <div>
      <p class="footer-name">{{ site.title }}</p>
      <p>{{ site.tagline }}</p>
    </div>
    <div>
      <p class="footer-label">Visit</p>
      <ul>
        <li><a href="mailto:{{ site.data.lab.email }}">{{ site.data.lab.email }}</a></li>
        <li><a href="{{ site.data.lab.pi_site }}">{{ site.data.lab.pi_name }}</a></li>
        <li><a href="{{ site.data.lab.github }}">GitHub · {{ site.data.lab.github_label }}</a></li>
      </ul>
    </div>
    <div>
      <p class="footer-label">Affiliation</p>
      <p>{{ site.data.lab.affiliation.name_en }}</p>
    </div>
  </div>
  <div class="container footer-base">
    <p>© {{ site.time | date: "%Y" }} {{ site.title }}</p>
    <p><a href="{{ '/feed.xml' | relative_url }}">Feed</a></p>
  </div>
</footer>
