---
layout: default
---
<article class="page">
  <header class="page-header">
    <div class="container">
      <p class="eyebrow"><a href="{{ '/news/' | relative_url }}">News</a></p>
      <h1>{{ page.title }}</h1>
      <p class="page-lede">
        <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%-d %B %Y" }}</time>
      </p>
    </div>
  </header>
  <div class="container page-body prose">
    {{ content }}
  </div>
</article>
